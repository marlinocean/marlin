<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Topic Study Reader | Ocean Star Marine Academy</title><meta name="theme-color" content="#071a2c"><link rel="icon" type="image/svg+xml" href="./favicon.svg">
<style>
:root{--navy:#071a2c;--panel:#102f4c;--line:#24445f;--gold:#d8b56d;--ink:#eaf0f5;--muted:#9bb0c2;--green:#69c6a0}
*{box-sizing:border-box}body{margin:0;background:var(--navy);color:var(--ink);font:16px/1.6 Inter,system-ui,sans-serif}header{position:sticky;top:0;z-index:5;background:#061727f2;border-bottom:1px solid var(--line);padding:12px max(16px,calc((100vw - 1050px)/2));display:flex;justify-content:space-between;align-items:center;gap:12px}header a{color:var(--gold);text-decoration:none}.brand{font-weight:800;letter-spacing:.07em;font-size:13px}.wrap{max-width:1050px;margin:auto;padding:28px 18px 60px}.hero{padding:22px;border:1px solid var(--line);border-radius:18px;background:linear-gradient(145deg,#123552,#0b243a);margin-bottom:18px}.eyebrow{color:var(--gold);font-size:11px;letter-spacing:.16em;font-weight:800}.hero h1{margin:5px 0;font-size:clamp(24px,4vw,36px)}.muted{color:var(--muted)}.question{padding:22px;border:1px solid var(--line);border-radius:16px;background:#0d2943;margin:14px 0;break-inside:avoid}.meta{color:var(--gold);font-size:11px;font-weight:800;letter-spacing:.12em}.question h2{font-size:20px;line-height:1.45;margin:8px 0 14px}.passage{padding:14px;background:#071e31;border-radius:12px;white-space:pre-wrap;margin:12px 0}.option{display:flex;gap:12px;align-items:flex-start;margin:9px 0;padding:11px;border:1px solid #24445f;border-radius:11px}.option img,.media-image{max-width:220px;max-height:180px;object-fit:contain;border-radius:10px;display:block}.picture-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(135px,1fr));gap:12px;margin-top:12px}.picture{border:1px solid var(--line);padding:12px;border-radius:12px;text-align:center;background:#071e31}.emoji{font-size:46px;display:block}.match-row{display:flex;align-items:center;gap:12px;padding:10px;border-bottom:1px solid var(--line)}.match-row .emoji{font-size:32px}.play{background:#d8b56d;color:#10263a;border:0;border-radius:9px;padding:10px 14px;font-weight:800;cursor:pointer;margin:8px 8px 8px 0}.audio{width:min(100%,420px);display:block;margin:10px 0}.answer{color:var(--green);margin-top:16px;font-weight:700}.explain{color:#c1d0dc}.loading,.error{padding:30px;text-align:center;color:var(--muted)}.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}.toolbar button{border:1px solid var(--line);background:#173b59;color:var(--ink);border-radius:10px;padding:9px 12px;cursor:pointer}@media(max-width:600px){.wrap{padding:18px 12px 45px}.question{padding:15px}.question h2{font-size:18px}header{padding:12px}}@media print{body{display:none!important}}
</style></head><body>
<header><div class="brand">⚓ OCEAN STAR MARINE ACADEMY</div><a href="./">← Back to Test Series</a></header>
<main class="wrap"><section class="hero"><div class="eyebrow">MARLIN TEST SERIES · TOPIC STUDY MATERIAL</div><h1 id="topicTitle">Loading topic…</h1><div id="topicMeta" class="muted">Fetching active questions</div><div class="toolbar"><button id="stopAudio" type="button">■ Stop audio</button><button id="topBtn" type="button">↑ Back to top</button></div></section><div id="content" class="loading">Loading study material…</div></main>
<script>
const API='https://tzfsjpqammpcysqjqmmi.supabase.co/functions/v1/marlin-api';
const KEY='sb_publishable_AJLiFAV6EW64S1-T6UYsqQ_e-ZhjaIA';
const names=['Grammar','Vocabulary','Listening','Reading','Correct Spelling','Pronunciation','Numbers & Time','Maritime English','Audio to Picture','Picture Word Matching','Paragraph Title Selection','Sentence Arrangement'];
const id=Number(new URLSearchParams(location.search).get('topic'));
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const plain=v=>{
 if(v===null||v===undefined)return '';
 if(typeof v==='string'||typeof v==='number'||typeof v==='boolean')return String(v);
 if(Array.isArray(v))return v.map(plain).filter(Boolean).join(' · ');
 if(typeof v==='object'){for(const k of ['label','text','value','answer','name','title','word','picture'])if(v[k]!==undefined&&v[k]!==null)return plain(v[k]);return ''}
 return '';
};
const safeUrl=v=>{if(typeof v!=='string')return '';try{const u=new URL(v.trim());return (u.protocol==='https:'||u.protocol==='http:')?u.href:''}catch{return ''}};
const speak=text=>{
 const words=plain(text).trim();if(!words)return;
 if(!('speechSynthesis'in window)){alert('Audio playback is not supported in this browser.');return}
 speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(words);u.lang='en-US';u.rate=.88;
 const voices=speechSynthesis.getVoices();const voice=voices.find(v=>v.lang.toLowerCase().startsWith('en')&&v.localService)||voices.find(v=>v.lang.toLowerCase().startsWith('en'));
 if(voice)u.voice=voice;speechSynthesis.speak(u);
};
function renderQuestion(q,i,total){
 const prompt=plain(q.prompt).replace(/^Marlin Test\s*\d+\s*[·•-]\s*Exercise\s*\d+\.\s*/i,'');
 const passage=plain(q.passage);
 let html='<article class="question"><div class="meta">QUESTION '+(i+1)+' OF '+total+'</div><h2>'+esc(prompt||'Question')+'</h2>';
 if(passage&&passage!==prompt)html+='<div class="passage">'+esc(passage)+'</div>';
 if(['listening','pronunciation','audio_picture'].includes(q.question_type)&&passage)html+='<button class="play" type="button" data-speak="'+i+'">▶ Play audio</button>';
 const media=safeUrl(q.media_url);
 if(media&&String(q.media_kind||'').toLowerCase()==='audio')html+='<audio class="audio" controls preload="none" src="'+esc(media)+'">Your browser does not support audio.</audio>';
 if(media&&String(q.media_kind||'').toLowerCase()==='image')html+='<img class="media-image" src="'+esc(media)+'" alt="Question image" loading="lazy">';
 if(q.question_type==='picture_matching'&&Array.isArray(q.matching_items)){
  html+='<div class="picture-grid">'+q.matching_items.map((it,j)=>{const icon=plain(it?.picture||it?.emoji||it?.image)||'⚓';const name=plain(it?.answer||it?.label||it?.name)||('Object '+(j+1));return '<div class="picture"><span class="emoji">'+esc(icon)+'</span><b>'+(j+1)+'. '+esc(name)+'</b></div>'}).join('')+'</div>';
 }else if(Array.isArray(q.options)&&q.options.length){
  const pictureMode=q.question_type==='audio_picture';
  html+='<div class="'+(pictureMode?'picture-grid':'')+'">'+q.options.map((o,j)=>{
   const label=plain(o?.label??o?.text??o?.value??o?.answer??o),icon=plain(o?.emoji||o?.picture||o?.icon),url=safeUrl(o?.image_url||o?.image||o?.src);
   if(pictureMode)return '<div class="picture">'+(icon?'<span class="emoji">'+esc(icon)+'</span>':'')+(url?'<img class="media-image" src="'+esc(url)+'" alt="'+esc(label)+'" loading="lazy">':'')+'<b>'+esc(label||('Picture '+(j+1)))+'</b></div>';
   return '<div class="option">'+(url?'<img class="media-image" src="'+esc(url)+'" alt="'+esc(label)+'" loading="lazy">':'')+'<span>'+esc(label||('Option '+(j+1)))+'</span></div>';
  }).join('')+'</div>';
 }
 const answer=plain(q.correct_answer),explanation=plain(q.explanation);
 if(answer)html+='<div class="answer">Correct answer: '+esc(answer)+'</div>';
 if(explanation)html+='<p class="explain"><b>Explanation:</b> '+esc(explanation)+'</p>';
 return html+'</article>';
}
document.getElementById('stopAudio').onclick=()=>{if('speechSynthesis'in window)speechSynthesis.cancel();document.querySelectorAll('audio').forEach(a=>a.pause())};
document.getElementById('topBtn').onclick=()=>window.scrollTo({top:0,behavior:'smooth'});
document.addEventListener('click',e=>{const b=e.target.closest('[data-speak]');if(b){const q=window.studyQuestions?.[Number(b.dataset.speak)];if(q)speak(q.passage||q.prompt)}});
document.addEventListener('contextmenu',e=>e.preventDefault());
document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&['p','s'].includes(e.key.toLowerCase())){e.preventDefault();e.stopPropagation()}});
(async()=>{
 const root=document.getElementById('content');
 if(!Number.isInteger(id)||id<1||id>12){root.className='error';root.textContent='Invalid topic link.';return}
 document.getElementById('topicTitle').textContent=names[id-1];
 try{
  const res=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json','apikey':KEY},body:JSON.stringify({action:'topic_study_content',topicId:id})});
  const data=await res.json();if(!res.ok)throw new Error(data.error||'Could not load study material.');
  const questions=data.questions||[];window.studyQuestions=questions;
  document.getElementById('topicMeta').textContent=questions.length+' active questions · Answers and explanations included; audio/pictures shown where supplied';
  root.className='';root.innerHTML=questions.length?questions.map((q,i)=>renderQuestion(q,i,questions.length)).join(''):'<p class="loading">No active questions are available for this topic.</p>';
 }catch(err){root.className='error';root.textContent=err.message}
})();
</script></body></html>
